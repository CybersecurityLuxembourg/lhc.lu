worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Keep the public site's existing browser security policy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://matomo.secin.lu; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://matomo.secin.lu https://api.cybersecurity.lu; connect-src 'self' https://api.cybersecurity.lu https://matomo.secin.lu; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block;" always;
        # Revalidate the HTML entry point after each deployment.
        add_header Cache-Control "no-cache" always;

        location = /healthz {
            default_type text/plain;
            return 200 "True";
        }

        location ^~ /.well-known/ {
            try_files $uri =404;
        }

        location ~ /\. {
            return 404;
        }

        location ~* \.(?:js|css|map|json|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|pdf|txt)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
